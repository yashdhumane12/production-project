name: TaskMaster CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE:        ${{ secrets.DOCKERHUB_USERNAME }}/taskmaster
  HELM_RELEASE: taskmaster
  NAMESPACE:    production

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r app/requirements.txt
      - run: pytest app/test_app.py -v

  # ── 2. Build & Push ───────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Helm Validate ─────────────────────────────────────────────
  helm-validate:
    name: Helm Validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: "3.14.0"}
      - run: helm lint helm/taskmaster/
      - run: helm template ${{ env.HELM_RELEASE }} helm/taskmaster/ --debug

  # ── 4. Deploy with health check + rollback ────────────────────────
  deploy:
    name: Deploy + Rollback Guard
    runs-on: ubuntu-latest
    needs: [build, helm-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: "3.14.0"}
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Record previous revision
        id: prev
        run: |
          REV=$(helm history ${{ env.HELM_RELEASE }} -n ${{ env.NAMESPACE }} --max 1 -o json 2>/dev/null \
                | python3 -c "import sys,json; h=json.load(sys.stdin); print(h[-1]['revision'] if h else 0)" 2>/dev/null || echo 0)
          echo "revision=$REV" >> $GITHUB_OUTPUT

      - name: Helm upgrade
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} helm/taskmaster/ \
            --namespace ${{ env.NAMESPACE }} --create-namespace \
            --set image.tag=${{ needs.build.outputs.tag }} \
            --set env.APP_VERSION=${{ needs.build.outputs.tag }} \
            --atomic --timeout 5m \
            --wait

      - name: Smoke test
        id: smoke
        run: |
          sleep 15
          for i in $(seq 1 10); do
            CODE=$(kubectl exec -n ${{ env.NAMESPACE }} \
              deploy/${{ env.HELM_RELEASE }}-app -- \
              python3 -c "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:5000/health'); sys.exit(0 if r.status==200 else 1)" \
              2>/dev/null && echo 200 || echo 500)
            echo "Attempt $i: $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          echo "Smoke test FAILED"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "Rolling back to revision ${{ steps.prev.outputs.revision }}"
          helm rollback ${{ env.HELM_RELEASE }} ${{ steps.prev.outputs.revision }} \
            -n ${{ env.NAMESPACE }} --wait
