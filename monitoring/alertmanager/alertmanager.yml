global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  repeat_interval: 3h
  routes:
    - match: {severity: critical}
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: "http://localhost:5001/alerts"
        send_resolved: true

  - name: critical
    email_configs:
      - to: "your-email@gmail.com"
        subject: "🚨 CRITICAL: {{ .GroupLabels.alertname }}"
        send_resolved: true
